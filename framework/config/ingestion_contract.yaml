# Ingestion Contract (v0.1)

contract:
  version: 1

dataset:
  name: sample_customer
  domain: payments
  description: "Synthetic sample dataset for framework scaffolding."
  owner: "data-platform-team"
  tags:
    - sample
    - payments

source:
  type: file
  format: csv
  location: "examples/data/sample_customer.csv"

target:
  logical_layer: bronze
  table_name: bronze.sample_customer
  mode: append

schema:
  version: 1
  columns:
    - name: customer_id
      type: string
      nullable: false
    - name: created_ts
      type: timestamp
      nullable: true

keys:
  primary:
    - customer_id

partitioning:
  columns:
    - created_ts

quality:
  enabled: false
  rules: []

lineage:
  enabled: false

observability:
  enabled: false